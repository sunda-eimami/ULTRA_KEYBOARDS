# =============================================================================
#  "first" — 44キー(片側22キー) 分割無線キーボード  Ergogen 設定  (XIAO 版)
# -----------------------------------------------------------------------------
#  - 片側: メイン 3行 x 6列 (outer/pinky/ring/middle/index/inner) + 親指 4キー
#  - Gallium v2 風 Columnar Staggered (薬指・中指を上げ、人差し指・小指を下げる)
#  - Kailh Choc v2 (PG1353) + Choc ホットスワップソケット (裏面)
#  - MCU: Seeed XIAO nRF52840 Plus (表面・SMD直付け) / ダイオード: 1N4148W SOD-123
#  - 502030 LiPo は MCU 下の「ベイ」領域の裏面に配置 (ガイド矩形を Dwgs.User に出力)
#  - 基板は左右で別設計 (first_left / first_right)。XIAO は USB とリセットボタンが
#    上面にあるためリバーシブル1枚基板にできない。
#
#  ピン割当 (ZMK: &xiao_d n):
#    列 outer..inner = D0 D1 D2 D3 D4 D5 / 親指 t1..t4 = D2 D3 D4 D5 (列を流用)
#    行 top=D9 home=D8 bottom=D7 thumb=D6
#    電源 JST(BAT_P) -> 電源SW -> VBAT (モジュール裏パッド) / リセットは本体ボタン
#
#  ビルド: npm run build  (= npx ergogen . --clean)
#  フットプリント: footprints/ceoloide/ (CC BY-NC-SA 4.0),
#                  footprints/local/mcu_xiao_nrf52840_plus.js (Seeed公式座標より)
# =============================================================================

meta:
  engine: 4.1.0
  name: first
  version: 0.2.0

# ---------------------------------------------------------------- 単位・変数
units:
  kx: 18               # キーピッチ X (mm)
  ky: 18               # キーピッチ Y (mm)
  px: 3                # 基板外形の余白 (キー外周からエッジまで)
  mcu_w: 18            # XIAO 幅 17.78mm + マージン
  mcu_h: 21            # XIAO 長さ (USB 突出 1.2mm は除く)
  bat_w: 20            # 502030 LiPo 幅
  bat_h: 30            # 502030 LiPo 長さ (厚み 5mm)
  bat_gap: 6           # プレビューでの左右基板の間隔
  thumb_splay: -8      # 親指キー1個あたりの扇状回転角 (時計回りが負)
  thumb_radius: 140    # 親指の弧の半径 (回転中心はキー中心から thumb_radius 下)

# ---------------------------------------------------------------- キー配置
points:
  key:
    spread: kx
    padding: ky
    width: kx
    height: ky

  # 右手側ポイント (mirror_*) の生成。右手基板 first_right はこちらを使う
  mirror:
    ref: mcu
    distance: mcu_w + 2px + bat_gap

  zones:
    # ------------------------------------------------------------ メインエリア
    matrix:
      anchor:
        shift: [100, -100]   # KiCad 上で座標が正になるようにオフセット
      columns:
        outer:                       # 装飾キー用 (小指の外側)
          key:
            column_net: D0
        pinky:
          key:
            stagger: 0
            column_net: D1
        ring:                        # 薬指: 大きく上げる
          key:
            stagger: 0.35ky
            column_net: D2
        middle:                      # 中指: 最も高い位置
          key:
            stagger: 0.14ky
            column_net: D3
        index:                       # 人差し指: 中指より下げる
          key:
            stagger: -0.25ky
            column_net: D4
        inner:                       # 人差し指の内側: さらに少し下げる
          key:
            stagger: -0.11ky
            column_net: D5
      rows:
        bottom:
          row_net: D7
        home:
          row_net: D8
        top:
          row_net: D9

    # ------------------------------------------------------------ 親指エリア
    thumb:
      anchor:
        ref: matrix_index_bottom
        shift: [-1.2kx, -1.15ky]
      key:
        rotate: -90              # 親指の可動域に直交させる
        row_net: D6              # 親指行
      columns:
        # t2 以降は thumb_radius 下の共通中心まわりに thumb_splay ずつ回転 → 真円弧
        t1:
          key:
            column_net: D2
        t2:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: D3
        t3:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: D4
        t4:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: D5
      rows:
        thumb:

    # ------------------------------------------------------------ MCU (XIAO nRF52840 Plus)
    # inner 列の右隣。モジュール上端 (USB) が基板上端とほぼ面一になる位置
    mcu:
      anchor:
        ref: matrix_inner_top
        shift: [0.5kx + 2 + 0.5mcu_w, 1.5]
      key:
        width: mcu_w
        height: mcu_h - 6    # 基板端がモジュール上端に来るよう外形計算上は短く扱う

    # ------------------------------------------------------------ 電源ベイ (バッテリー+JST+電源SW)
    # MCU 直下に外形を下へ広げるための領域。ポイント名は "batt"
    batt:
      anchor:
        ref: mcu
        shift: [0, -29]
      key:
        width: mcu_w
        height: bat_h

# ---------------------------------------------------------------- 外形
outlines:
  _keys_left:
    - what: rectangle
      where: /^(matrix|thumb)_/
      size: [kx - 0.5, ky - 0.5]
      corner: 1

  keys:
    - what: rectangle
      where: /^(matrix|thumb)_/
      asym: both
      size: [kx - 0.5, ky - 0.5]
      corner: 1

  # ---- 左手基板の外形
  _hull:
    - what: hull
      concavity: 45
      points:
        - ref: matrix_outer_bottom
        - ref: matrix_outer_top
        - ref: matrix_pinky_top
        - ref: matrix_ring_top
        - ref: matrix_middle_top
        - ref: matrix_index_top
        - ref: matrix_inner_top
        - ref: mcu
        - ref: batt
        - ref: thumb_t4_thumb
        - ref: thumb_t3_thumb
        - ref: thumb_t2_thumb
        - ref: thumb_t1_thumb
        - ref: matrix_middle_bottom
        - ref: matrix_ring_bottom
        - ref: matrix_pinky_bottom

  board:
    - what: outline
      name: _hull
      expand: px
      joints: round

  # ---- 右手基板の外形 (ミラーポイント版)
  _hull_right:
    - what: hull
      concavity: 45
      points:
        - ref: mirror_matrix_outer_bottom
        - ref: mirror_matrix_outer_top
        - ref: mirror_matrix_pinky_top
        - ref: mirror_matrix_ring_top
        - ref: mirror_matrix_middle_top
        - ref: mirror_matrix_index_top
        - ref: mirror_matrix_inner_top
        - ref: mirror_mcu
        - ref: mirror_batt
        - ref: mirror_thumb_t4_thumb
        - ref: mirror_thumb_t3_thumb
        - ref: mirror_thumb_t2_thumb
        - ref: mirror_thumb_t1_thumb
        - ref: mirror_matrix_middle_bottom
        - ref: mirror_matrix_ring_bottom
        - ref: mirror_matrix_pinky_bottom

  board_right:
    - what: outline
      name: _hull_right
      expand: px
      joints: round

  # ---- 502030 LiPo ガイド (裏面配置)
  battery:
    - what: rectangle
      where:
        ref: batt
        shift: [0, -2]
      size: [bat_w, bat_h - 4]
      corner: 1

  battery_right:
    - what: rectangle
      where:
        ref: mirror_batt
        shift: [0, -2]
      size: [bat_w, bat_h - 4]
      corner: 1

  preview:
    - name: board
    - name: board_right
      operation: stack
    - name: keys
      operation: stack
    - name: battery
      operation: stack
    - name: battery_right
      operation: stack

# ---------------------------------------------------------------- PCB (左右別設計)
pcbs:
  # ============================================================== 左手
  first_left:
    template: kicad8
    outlines:
      edge:
        outline: board
      battery:
        outline: battery
        layer: Dwgs.User
    footprints:
      choc:
        what: ceoloide/switch_choc_v1_v2
        where: /^(matrix|thumb)_/
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          side: B                    # ソケットは裏面
          hotswap: true
          reversible: false
          choc_v2_support: true
          choc_v1_support: true

      diode:
        what: ceoloide/diode_tht_sod123
        where: /^(matrix|thumb)_/
        adjust:
          shift: [0, -7.2]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          side: B
          reversible: false
          include_tht: false

      # XIAO nRF52840 Plus (表面 SMD)。VBAT/GND はスルーホールで裏から半田付け
      mcu:
        what: local/mcu_xiao_nrf52840_plus
        where: mcu
        params:
          side: F
          VBAT: VBAT

      # バッテリーコネクタ (表面・開口部を下=バッテリー側に向ける)
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where: mcu
        adjust:
          shift: [0, -14]
        params:
          side: F
          BAT_P: BAT_P
          BAT_N: GND

      # 電源スイッチ (ベイ右端・ツマミが基板端から出る)
      power_switch:
        what: ceoloide/power_switch_smd_side
        where: batt
        adjust:
          shift: [9.9, 6]
        params:
          side: F
          from: BAT_P
          to: VBAT

      # M2 ネジ用 NPTH (キー4個の交点)
      hole_a:
        what: ceoloide/mounting_hole_npth
        where: matrix_pinky_top
        adjust:
          shift: [-0.5kx, -0.5ky]
      hole_b:
        what: ceoloide/mounting_hole_npth
        where: matrix_pinky_bottom
        adjust:
          shift: [-0.5kx, 0.5ky]
      hole_c:
        what: ceoloide/mounting_hole_npth
        where: matrix_middle_bottom
        adjust:
          shift: [0, -0.72ky]
      hole_d:
        what: ceoloide/mounting_hole_npth
        where: matrix_inner_bottom
        adjust:
          shift: [0, -0.72ky]

  # ============================================================== 右手
  first_right:
    template: kicad8
    outlines:
      edge:
        outline: board_right
      battery:
        outline: battery_right
        layer: Dwgs.User
    footprints:
      choc:
        what: ceoloide/switch_choc_v1_v2
        where: /^mirror_(matrix|thumb)_/
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          side: B
          hotswap: true
          reversible: false
          choc_v2_support: true
          choc_v1_support: true

      diode:
        what: ceoloide/diode_tht_sod123
        where: /^mirror_(matrix|thumb)_/
        adjust:
          shift: [0, -7.2]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          side: B
          reversible: false
          include_tht: false

      mcu:
        what: local/mcu_xiao_nrf52840_plus
        where: mirror_mcu
        params:
          side: F
          VBAT: VBAT

      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where: mirror_mcu
        adjust:
          shift: [0, -14]
        params:
          side: F
          BAT_P: BAT_P
          BAT_N: GND

      power_switch:
        what: ceoloide/power_switch_smd_side
        where: mirror_batt
        adjust:
          shift: [9.9, 6]
          rotate: 180
        params:
          side: F
          from: BAT_P
          to: VBAT

      hole_a:
        what: ceoloide/mounting_hole_npth
        where: mirror_matrix_pinky_top
        adjust:
          shift: [-0.5kx, -0.5ky]
      hole_b:
        what: ceoloide/mounting_hole_npth
        where: mirror_matrix_pinky_bottom
        adjust:
          shift: [-0.5kx, 0.5ky]
      hole_c:
        what: ceoloide/mounting_hole_npth
        where: mirror_matrix_middle_bottom
        adjust:
          shift: [0, -0.72ky]
      hole_d:
        what: ceoloide/mounting_hole_npth
        where: mirror_matrix_inner_bottom
        adjust:
          shift: [0, -0.72ky]
