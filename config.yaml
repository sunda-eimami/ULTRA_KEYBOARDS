# =============================================================================
#  "first" — 44キー(片側22キー) 分割無線キーボード  Ergogen 設定
# -----------------------------------------------------------------------------
#  - 片側: メイン 3行 x 6列 (outer/pinky/ring/middle/index/inner) + 親指 4キー
#  - Gallium v2 風 Columnar Staggered (薬指・中指を上げ、人差し指・小指を下げる)
#  - Kailh Choc v2 (PG1353) + Choc ホットスワップソケット
#  - MCU: nice!nano v2 / ダイオード: 1N4148W (SOD-123)
#  - 502030 LiPo (20 x 30 x 5mm) を MCU 裏側(基板裏面)に配置する想定
#
#  座標系: Ergogen は +y が「上」。KiCad 出力時に y が反転される。
#  ビルド: npm run build  (= npx ergogen . --clean)
#  フットプリント: footprints/ceoloide/  (https://github.com/ceoloide/ergogen-footprints)
# =============================================================================

meta:
  engine: 4.1.0        # ceoloide 製 KiCad8 フットプリントに必要な最低バージョン
  name: first
  version: 0.1.0

# ---------------------------------------------------------------- 単位・変数
units:
  kx: 18               # キーピッチ X (mm)
  ky: 18               # キーピッチ Y (mm)
  px: 3                # 基板外形の余白 (キー外周からエッジまで)
  mcu_w: 18            # nice!nano v2 幅
  mcu_h: 33            # nice!nano v2 長さ (USB コネクタ突出分は除く)
  bat_w: 20            # 502030 LiPo 幅
  bat_h: 30            # 502030 LiPo 長さ (厚み 5mm)
  bat_gap: 6           # 左右基板間の隙間 (プレビュー用ミラー距離の計算に使用)
  thumb_splay: -8      # 親指キー1個あたりの扇状回転角 (時計回りが負)
  thumb_radius: 140    # 親指の弧の半径 (回転中心はキー中心から thumb_radius 下)

# ---------------------------------------------------------------- キー配置
points:
  # 全ゾーン共通のキー既定値
  key:
    spread: kx         # 列ピッチ
    padding: ky        # 行ピッチ
    width: kx          # 外形計算に使うキー幅
    height: ky         # 外形計算に使うキー高さ

  # 右手用プレビュー (KiCad PCB には左手側の点のみを使用。asym: source が既定)
  mirror:
    ref: mcu
    distance: mcu_w + 2px + bat_gap

  zones:
    # ------------------------------------------------------------ メインエリア
    matrix:
      anchor:
        shift: [100, -100]   # KiCad 上で座標が正になるようにオフセット
      columns:
        # stagger は「ひとつ左の列に対する相対的な縦ズレ」(累積される)
        #   絶対値: outer 0 / pinky 0 / ring +6.3 / middle +8.8 / index +4.3 / inner +2.3 (mm)
        outer:                       # 装飾キー用 (小指の外側)
          key:
            column_net: P21
        pinky:
          key:
            stagger: 0
            column_net: P20
        ring:                        # 薬指: 大きく上げる
          key:
            stagger: 0.35ky
            column_net: P19
        middle:                      # 中指: 最も高い位置
          key:
            stagger: 0.14ky
            column_net: P18
        index:                       # 人差し指: 中指より下げる
          key:
            stagger: -0.25ky
            column_net: P15
        inner:                       # 人差し指の内側: さらに少し下げる
          key:
            stagger: -0.11ky
            column_net: P14
      rows:
        # 一番下の行から定義 (Ergogen は行を上方向に積む)
        bottom:
          row_net: P8
        home:
          row_net: P16
        top:
          row_net: P10

    # ------------------------------------------------------------ 親指エリア
    thumb:
      # index の bottom キーを基準点に、約1.2キー分左・約1.15行分下から親指キーを開始
      # (t1 は middle 列の下、t2/t3 が index/inner 列の下、t4 が inner の外側に来る)
      anchor:
        ref: matrix_index_bottom
        shift: [-1.2kx, -1.15ky]
      key:
        rotate: -90              # 親指の可動域に対して直交させるため各キーを -90° 回転
        row_net: P9              # 親指行の行ネット
      columns:
        # t2 以降は spread: 0 にして、thumb_radius 下の共通中心まわりに thumb_splay ずつ
        # 回転させることで、親指の可動域に沿った「真円弧」上に扇状配置する
        # (弦長 ≒ 140mm * 8° ≒ 19.5mm、隣接キー同士は重ならない)
        # 列ネットは物理的に近いメイン列のネットを流用 (Corne 等と同じ方式)
        t1:
          key:
            column_net: P19
        t2:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: P18
        t3:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: P15
        t4:
          key:
            spread: 0
            splay: thumb_splay
            origin: [0, -thumb_radius]
            column_net: P14
      rows:
        thumb:

    # ------------------------------------------------------------ MCU (nice!nano v2)
    # inner 列の右隣・上寄せに配置。単一ポイント "mcu" が生成される。
    mcu:
      anchor:
        ref: matrix_inner_top
        shift: [0.5kx + 2 + 0.5mcu_w, -6.5]
      key:
        width: mcu_w
        # 外形余白 px に対して USB 側 (上端) を基板端 1mm 内側に寄せるため 4mm 短く扱う
        height: mcu_h - 4

# ---------------------------------------------------------------- 外形
outlines:
  # キー実寸のプレビュー (左手側のみ)
  _keys_left:
    - what: rectangle
      where: /^(matrix|thumb)_/
      size: [kx - 0.5, ky - 0.5]
      corner: 1

  # キー配置プレビュー (左右両方: 全 44 キー)
  keys:
    - what: rectangle
      where: /^(matrix|thumb)_/
      asym: both
      size: [kx - 0.5, ky - 0.5]
      corner: 1

  # 基板外形の元になる包絡線 (各キー矩形 + MCU 矩形の hull)
  _hull:
    - what: hull
      concavity: 45
      points:
        - ref: matrix_outer_bottom
        - ref: matrix_outer_top
        - ref: matrix_pinky_top
        - ref: matrix_ring_top
        - ref: matrix_middle_top
        - ref: matrix_index_top
        - ref: matrix_inner_top
        - ref: mcu
        - ref: thumb_t4_thumb
        - ref: thumb_t3_thumb
        - ref: thumb_t2_thumb
        - ref: thumb_t1_thumb
        - ref: matrix_middle_bottom
        - ref: matrix_ring_bottom
        - ref: matrix_pinky_bottom

  # PCB エッジ (Edge.Cuts)
  board:
    - what: outline
      name: _hull
      expand: px
      joints: round

  # 502030 LiPo の占有範囲 (MCU 直下の基板裏面に配置)
  battery:
    - what: rectangle
      where: mcu
      size: [bat_w, bat_h]
      corner: 1

  # 全体プレビュー (基板外形 + キー + バッテリー)
  preview:
    - name: board
    - name: _keys_left
      operation: stack
    - name: battery
      operation: stack

# ---------------------------------------------------------------- PCB
pcbs:
  first:
    template: kicad8           # ceoloide フットプリントは KiCad 8 形式
    outlines:
      edge:
        outline: board         # Edge.Cuts
      battery:
        outline: battery
        layer: Dwgs.User       # バッテリー位置ガイド
    footprints:
      # ---- キースイッチ: Choc v1/v2 対応ホットスワップ (ソケットは裏面、リバーシブル)
      choc:
        what: ceoloide/switch_choc_v1_v2
        where: /^(matrix|thumb)_/
        params:
          from: "{{column_net}}"     # 列ネット → スイッチ pin1
          to: "{{colrow}}"           # スイッチ pin2 → ダイオード (キー固有ネット)
          hotswap: true
          reversible: true
          choc_v2_support: true      # 中央穴 5.0mm (Choc v2)
          choc_v1_support: true      # v1 用 1.9mm 位置決め穴も残す (v1 も挿せる)
          include_keycap: false

      # ---- ダイオード 1N4148W (SOD-123, 裏面 SMD, リバーシブル)
      #      col2row: 列 → スイッチ → ダイオード(アノード=from) → 行(カソード=to)
      diode:
        what: ceoloide/diode_tht_sod123
        where: /^(matrix|thumb)_/
        adjust:
          shift: [0, -7.2]           # ソケット/Choc v2 スタビ用パッドと干渉しないキー下側へ
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          reversible: true
          include_tht: false
          include_traces_vias: true

      # ---- MCU: nice!nano v2 (リバーシブル・ジャンパー式、チップ面を基板側に向けて実装)
      #      列: P21 P20 P19 P18 P15 P14 / 行: P10(top) P16(home) P8(bottom) P9(thumb)
      mcu:
        what: ceoloide/mcu_nice_nano
        where: mcu
        params:
          reversible: true
          reverse_mount: true

      # ---- バッテリーコネクタ JST PH 2pin (裏面、開口部を MCU 直下のバッテリーへ向ける)
      battery_jst:
        what: ceoloide/battery_connector_jst_ph_2
        where: mcu
        adjust:
          shift: [0, -28]
          rotate: 180
        params:
          side: B
          reversible: true
          BAT_P: BAT_P
          BAT_N: GND

      # ---- 電源スイッチ (横押しスライド, Alps SSSS811101 等) 基板右端
      power_switch:
        what: ceoloide/power_switch_smd_side
        where: mcu
        adjust:
          shift: [10, -27]
        params:
          reversible: true
          from: BAT_P              # バッテリー+
          to: RAW                  # nice!nano B+/RAW

      # ---- リセットスイッチ (横押し, Panasonic EVQ-PUC02K) 基板右端
      reset_switch:
        what: ceoloide/reset_switch_smd_side
        where: mcu
        adjust:
          shift: [9.6, -36]
          rotate: -90
        params:
          reversible: true
          from: GND
          to: RST
